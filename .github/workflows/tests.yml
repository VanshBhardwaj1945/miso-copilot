name: tests

# Runs the ingestion lane's suite on every push and every pull request, so
# "do the tests pass" is answered by the repo rather than by whoever last
# remembered to check.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Developer tools, deliberately not in requirements.txt - nothing
          # the product imports needs them.
          pip install pytest pytest-cov

      - name: Run tests
        # pytest.ini already carries --cov and --cov-fail-under=90, so a drop
        # in coverage fails the job the same way a failing test does.
        #
        # No MISO endpoint is contacted: 561 of the tests need no socket at
        # all and the rest drive a stub bound to 127.0.0.1. MISO rate-limits
        # by IP, and a CI runner hammering them from a shared address is
        # exactly the traffic that gets an organization banned.
        run: pytest
