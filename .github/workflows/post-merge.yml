name: post-merge

# The heavy jobs that run once code lands on main:
#   DAST   - OWASP ZAP baseline scan against a booted backend
#   SCA    - dependency audit (report-only: the Intel-Mac torch pin drags
#            known CVEs the dev machines can't drop)
#   image  - build the backend Docker image and push it to GHCR; this is the
#            image infra/ references

on:
  push:
    branches: [main]

# nothing in this workflow may ever contact MISO
env:
  MISO_POLLER_ENABLED: "0"

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # no CLAUDE_API_KEY on purpose: /ask serves its 503 handoff path
      - name: Boot the backend
        run: |
          nohup python -m uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          allow_issue_writing: false

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true # report-only, see header comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr requires lowercase; github.repository isn't
          tags: |
            ghcr.io/vanshbhardwaj1945/miso-copilot:latest
            ghcr.io/vanshbhardwaj1945/miso-copilot:${{ github.sha }}
