name: post-merge

# The heavy jobs that run once code lands on main:
#   DAST   - OWASP ZAP baseline scan against a booted backend
#   SCA    - dependency audit (report-only: the Intel-Mac torch pin drags
#            known CVEs the dev machines can't drop)
#   image  - build the backend Docker image and push it to GHCR; this is the
#            image infra/ references

on:
  push:
    branches: [main]

# nothing in this workflow may ever contact MISO
env:
  MISO_POLLER_ENABLED: "0"

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # no CLAUDE_API_KEY on purpose: /ask serves its 503 handoff path
      - name: Boot the backend
        run: |
          nohup python -m uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          allow_issue_writing: false

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true # report-only, see header comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Every ignored advisory below was checked against how this app actually
      # uses the package, on 2026-09-10, and none are reachable here. Re-check
      # when the pins move - an ignore that outlives its reason is worse than
      # a red build.
      #
      # transformers: all five need an attacker-controlled model, checkpoint or
      #   config.json. store.py loads one hardcoded model
      #   (sentence-transformers/all-MiniLM-L6-v2) and nothing else. No
      #   torch.load, no Trainer, and trust_remote_code appears nowhere in the
      #   repo. Fixed in transformers 5.x, which needs torch>=2.5 - no wheel on
      #   the Intel Mac this is developed on, so the upgrade is deferred and
      #   tracked, not forgotten.
      # chromadb: all four are server-mode issues - the /api/v2/tenants HTTP
      #   API and multi-tenant RBAC. We use chromadb.PersistentClient, embedded,
      #   with no server and no tenants, so those endpoints do not exist here.
      #   1.5.9 is the newest release; there is nothing to upgrade to.
      # nltk: a pathsec sandbox bypass in TransitionParser / AveragedPerceptron
      #   model persistence, none of which this app calls - nltk arrives
      #   transitively through llama-index. Upstream says "not yet patched".
      - run: >
          pip-audit -r requirements.txt --no-deps
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3740
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr requires lowercase; github.repository isn't
          tags: |
            ghcr.io/vanshbhardwaj1945/miso-ramen:latest
            ghcr.io/vanshbhardwaj1945/miso-ramen:${{ github.sha }}
