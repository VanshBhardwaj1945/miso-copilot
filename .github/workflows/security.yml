name: pr-gate

# Fast, deterministic checks that gate a PR (mark these as required checks in
# branch protection and a PR cannot merge until they're green). The slower,
# heavier jobs run after merge - see post-merge.yml. The earliest layer runs
# before code even leaves a laptop: `pre-commit install` (.pre-commit-config.yaml).

on:
  pull_request:
  push:
    branches: ["**"]

# nothing in this workflow may ever contact MISO
env:
  MISO_POLLER_ENABLED: "0"

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll: medium severity and up fails the build; low-severity noise doesn't
      - run: bandit -r backend app.py -ll

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
