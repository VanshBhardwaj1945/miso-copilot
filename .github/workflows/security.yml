name: security

# The security half of CI (tests.yml is the quality half):
#   SAST     - bandit over the backend
#   secrets  - gitleaks over the full history
#   SCA      - pip-audit + npm audit (report-only: torch is pinned for
#              Intel-Mac dev machines and drags known CVEs we can't take)
#   IaC      - terraform fmt + validate on infra/
#   build    - the React frontend must compile
#   DAST     - OWASP ZAP baseline scan against a booted backend

on:
  push:
    branches: ["**"]
  pull_request:

# nothing in this workflow may ever contact MISO
env:
  MISO_POLLER_ENABLED: "0"

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll: medium severity and up fails the build; low-severity noise doesn't
      - run: bandit -r backend app.py -ll

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true # report-only, see header comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high
        working-directory: frontend

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # no CLAUDE_API_KEY on purpose: /ask serves its 503 handoff path, and
      # MISO_POLLER_ENABLED=0 (workflow env) keeps CI traffic away from MISO
      - name: Boot the backend
        run: |
          nohup python -m uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          allow_issue_writing: false
          # baseline scan warns rather than fails by default; findings land
          # in the job log and the uploaded report artifact
