# Everything running, always: `docker compose up -d` once, then forget it.
# Containers restart on reboot (as long as Docker Desktop is running).
#   backend  -> http://localhost:8000   (FastAPI + poller + RAG)
#   frontend -> http://localhost:5173   (Vite dev server)

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env # CLAUDE_API_KEY - gitignored, never committed
    volumes:
      - ./data:/app/data # snapshots, Chroma, request log - inspectable from the host
      - model-cache:/home/app/.cache # embedding model + rate-guard lease survive restarts
    restart: unless-stopped

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
  frontend-modules:
