<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087CC1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E8814"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ADB5BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="630" fill="#FFFFFF"/>

  <!-- row 1: background feed -->
  <rect x="40" y="60" width="1080" height="145" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="88" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">1 &#8212; EVERY 5 MINUTES: KEEP A FRESH LOCAL COPY</text>

  <rect x="60" y="104" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="160" y="130" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">MISO Public APIs</text>
  <text x="160" y="152" font-size="11" fill="#526575" text-anchor="middle">free JSON, no auth</text>
  <text x="160" y="168" font-size="11" fill="#526575" text-anchor="middle">fuel mix &#183; load &#183; wind/solar</text>

  <rect x="290" y="104" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="390" y="130" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Poller</text>
  <text x="390" y="152" font-size="11" fill="#526575" text-anchor="middle">rate-guarded fetch</text>
  <text x="390" y="168" font-size="11" fill="#526575" text-anchor="middle">max 1 req/link/min</text>

  <rect x="520" y="104" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="620" y="130" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Plain-English rewrite</text>
  <text x="620" y="152" font-size="11" fill="#526575" text-anchor="middle">JSON &#8594; prose</text>
  <text x="620" y="168" font-size="11" fill="#526575" text-anchor="middle">prose is what search finds</text>

  <rect x="750" y="104" width="200" height="76" rx="10" fill="#EDF6FB" stroke="#087CC1" stroke-width="1.5"/>
  <text x="850" y="130" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Chroma</text>
  <text x="850" y="152" font-size="11" fill="#526575" text-anchor="middle">local vector DB</text>
  <text x="850" y="168" font-size="11" fill="#526575" text-anchor="middle">always the freshest snapshot</text>

  <line x1="260" y1="142" x2="286" y2="142" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="142" x2="516" y2="142" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="142" x2="746" y2="142" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2: question time -->
  <rect x="40" y="245" width="1080" height="145" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="273" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">2 &#8212; WHEN YOU ASK</text>

  <rect x="60" y="289" width="200" height="76" rx="38" fill="#092A47"/>
  <text x="160" y="322" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">User</text>
  <text x="160" y="343" font-size="11" fill="#B8C6D1" text-anchor="middle">curious citizen &#8594; grid engineer</text>

  <rect x="290" y="289" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="390" y="315" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Chat widget</text>
  <text x="390" y="337" font-size="11" fill="#526575" text-anchor="middle">React &#183; charts + markdown</text>
  <text x="390" y="353" font-size="11" fill="#526575" text-anchor="middle">Streamlit backup</text>

  <rect x="520" y="289" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="620" y="315" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">FastAPI</text>
  <text x="620" y="337" font-size="11" fill="#526575" text-anchor="middle">/ask &#183; input capped</text>
  <text x="620" y="353" font-size="11" fill="#526575" text-anchor="middle">per-IP rate limit + logging</text>

  <rect x="750" y="289" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="850" y="315" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Claude</text>
  <text x="850" y="337" font-size="11" fill="#526575" text-anchor="middle">writes the answer from</text>
  <text x="850" y="353" font-size="11" fill="#526575" text-anchor="middle">the retrieved snapshots</text>

  <line x1="260" y1="327" x2="286" y2="327" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="327" x2="516" y2="327" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="327" x2="746" y2="327" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- store feeds the answer -->
  <line x1="850" y1="180" x2="850" y2="285" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="222" font-size="11" fill="#526575">top-4 matching snapshots</text>
  <text x="865" y="238" font-size="11" fill="#526575">+ their source links</text>
  <line x1="640" y1="285" x2="790" y2="184" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="225" font-size="11" fill="#526575" text-anchor="end">search by meaning</text>

  <!-- answer back -->
  <path d="M 850 365 C 850 412 210 412 162 369" fill="none" stroke="#3E8814" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrowg)"/>
  <text x="505" y="416" font-size="12" font-weight="600" fill="#3E8814" text-anchor="middle">answer &#183; &#8220;as of 6:55 PM EST&#8221; &#183; source link</text>

  <!-- row 3: maybe later -->
  <rect x="40" y="440" width="1080" height="130" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-dasharray="8 5"/>
  <text x="60" y="468" font-size="12" font-weight="600" letter-spacing="1.5" fill="#868E96">3 &#8212; MAYBE / LATER</text>

  <rect x="60" y="482" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="506" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">answer cache</text>
  <text x="160" y="526" font-size="11" fill="#868E96" text-anchor="middle">same question again? reuse</text>
  <text x="160" y="541" font-size="11" fill="#868E96" text-anchor="middle">the answer, skip Claude</text>

  <rect x="290" y="482" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="390" y="506" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">auto-resync</text>
  <text x="390" y="526" font-size="11" fill="#868E96" text-anchor="middle">refresh Chroma after every</text>
  <text x="390" y="541" font-size="11" fill="#868E96" text-anchor="middle">poll, not just at boot</text>

  <rect x="520" y="482" width="200" height="70" rx="35" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="506" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">someone's AI agent</text>
  <text x="620" y="526" font-size="11" fill="#868E96" text-anchor="middle">Claude Code, Cursor,</text>
  <text x="620" y="541" font-size="11" fill="#868E96" text-anchor="middle">a script</text>

  <rect x="750" y="482" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="850" y="506" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">MCP server</text>
  <text x="850" y="526" font-size="11" fill="#868E96" text-anchor="middle">get_fuel_mix() &#183; search_miso()</text>
  <text x="850" y="541" font-size="11" fill="#868E96" text-anchor="middle">reads local data, not MISO</text>

  <line x1="720" y1="517" x2="746" y2="517" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>

  <text x="580" y="606" font-size="13" fill="#526575" text-anchor="middle">No live MISO calls at question time &#8212; answers come from the local copy and always say how fresh they are.</text>
</svg>
