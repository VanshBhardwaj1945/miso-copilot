<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="985" viewBox="0 0 1240 985" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087CC1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E8814"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ADB5BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="985" fill="#FFFFFF"/>
  <text x="620" y="36" font-size="18" font-weight="700" fill="#092A47" text-anchor="middle">MISO Copilot &#8212; detailed architecture</text>

  <!-- row 1: background feed -->
  <rect x="40" y="60" width="1160" height="190" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="90" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">1 &#8212; BACKGROUND FEED, EVERY 5 MINUTES</text>

  <rect x="70" y="105" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="195" y="131" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">MISO Public APIs</text>
  <text x="86" y="156" font-size="11.5" fill="#526575">&#8226;  FuelMix &#183; RealTimeTotalLoad</text>
  <text x="86" y="174" font-size="11.5" fill="#526575">&#8226;  Snapshot &#183; WindSolar</text>
  <text x="86" y="192" font-size="11.5" fill="#526575">&#8226;  free JSON, no auth</text>

  <rect x="365" y="105" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="490" y="131" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Poller</text>
  <text x="381" y="156" font-size="11.5" fill="#526575">&#8226;  rate guard: 1 req/link/min lease</text>
  <text x="381" y="174" font-size="11.5" fill="#526575">&#8226;  shape gate rejects bad payloads</text>
  <text x="381" y="192" font-size="11.5" fill="#526575">&#8226;  atomic writes, fails closed</text>
  <text x="381" y="210" font-size="11.5" fill="#526575">&#8226;  627 tests, 100% coverage</text>

  <rect x="660" y="105" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="785" y="131" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">data/raw/</text>
  <text x="676" y="156" font-size="11.5" fill="#526575">&#8226;  verbatim JSON, one per feed</text>
  <text x="676" y="174" font-size="11.5" fill="#526575">&#8226;  _status.json: health + frozen-</text>
  <text x="676" y="192" font-size="11.5" fill="#526575">    feed detection (RefId)</text>
  <text x="676" y="210" font-size="11.5" fill="#526575">&#8226;  raw.backup/ = demo fallback</text>

  <rect x="955" y="105" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="1080" y="131" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">RAG sync</text>
  <text x="971" y="156" font-size="11.5" fill="#526575">&#8226;  JSON &#8594; plain-English prose</text>
  <text x="971" y="174" font-size="11.5" fill="#526575">&#8226;  UPSERT, fixed id per feed &#8212;</text>
  <text x="971" y="192" font-size="11.5" fill="#526575">    replace, never append</text>
  <text x="971" y="210" font-size="11.5" fill="#526575">&#8226;  no chunking: one paragraph</text>

  <line x1="320" y1="167" x2="361" y2="167" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="167" x2="656" y2="167" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="167" x2="951" y2="167" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2: the store -->
  <rect x="40" y="290" width="1160" height="190" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="320" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">2 &#8212; THE STORE</text>

  <rect x="70" y="335" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="195" y="361" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Embeddings</text>
  <text x="86" y="386" font-size="11.5" fill="#526575">&#8226;  all-MiniLM-L6-v2</text>
  <text x="86" y="404" font-size="11.5" fill="#526575">&#8226;  runs on-device, $0</text>
  <text x="86" y="422" font-size="11.5" fill="#526575">&#8226;  text &#8594; meaning-vectors</text>

  <rect x="365" y="335" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="490" y="361" font-size="14" font-weight="600" fill="#495057" text-anchor="middle">Doc lane &#8212; planned</text>
  <text x="381" y="386" font-size="11.5" fill="#868E96">&#8226;  data/docs/ is empty today</text>
  <text x="381" y="404" font-size="11.5" fill="#868E96">&#8226;  chunk 512/50 &#8594; embed</text>
  <text x="381" y="422" font-size="11.5" fill="#868E96">&#8226;  unlocks &#8220;where do I find X?&#8221;</text>

  <rect x="660" y="335" width="250" height="125" rx="10" fill="#EDF6FB" stroke="#087CC1" stroke-width="1.5"/>
  <text x="785" y="361" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Chroma</text>
  <text x="676" y="386" font-size="11.5" fill="#526575">&#8226;  the ONLY store &#183; local disk</text>
  <text x="676" y="404" font-size="11.5" fill="#526575">&#8226;  4 live snapshot docs, fresh</text>
  <text x="676" y="422" font-size="11.5" fill="#526575">&#8226;  + doc chunks (later)</text>

  <line x1="320" y1="397" x2="361" y2="397" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="397" x2="656" y2="397" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>
  <path d="M 1080 230 C 1080 290 960 320 912 360" fill="none" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 3: question time -->
  <rect x="40" y="520" width="1160" height="215" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="550" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">3 &#8212; WHEN YOU ASK</text>

  <rect x="70" y="565" width="250" height="125" rx="55" fill="#092A47"/>
  <text x="195" y="615" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">User</text>
  <text x="195" y="640" font-size="11.5" fill="#B8C6D1" text-anchor="middle">curious citizen &#8594; grid engineer</text>

  <rect x="365" y="565" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="490" y="591" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Chat widget</text>
  <text x="381" y="616" font-size="11.5" fill="#526575">&#8226;  React: markdown, KaTeX, charts</text>
  <text x="381" y="634" font-size="11.5" fill="#526575">&#8226;  Streamlit backup UI</text>
  <text x="381" y="652" font-size="11.5" fill="#526575">&#8226;  never a dead end: handoff to</text>
  <text x="381" y="670" font-size="11.5" fill="#526575">    MISO's contact form on failure</text>

  <rect x="660" y="565" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="785" y="591" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">FastAPI /ask</text>
  <text x="676" y="616" font-size="11.5" fill="#526575">&#8226;  input capped at 2000 chars</text>
  <text x="676" y="634" font-size="11.5" fill="#526575">&#8226;  20 req/min per IP</text>
  <text x="676" y="652" font-size="11.5" fill="#526575">&#8226;  logs ip &#183; question &#183; outcome</text>
  <text x="676" y="670" font-size="11.5" fill="#526575">&#8226;  clean HTTP errors</text>

  <rect x="955" y="565" width="250" height="125" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="1080" y="591" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Claude</text>
  <text x="971" y="616" font-size="11.5" fill="#526575">&#8226;  Opus 5 + MISO system prompt</text>
  <text x="971" y="634" font-size="11.5" fill="#526575">&#8226;  answers ONLY from retrieved</text>
  <text x="971" y="652" font-size="11.5" fill="#526575">    snapshots, states the as-of time</text>
  <text x="971" y="670" font-size="11.5" fill="#526575">&#8226;  FORCE_MOCK switch, free tests</text>

  <line x1="320" y1="627" x2="361" y2="627" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="627" x2="656" y2="627" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="627" x2="951" y2="627" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="785" y1="565" x2="785" y2="464" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="520" font-size="11" fill="#526575">search by meaning</text>
  <line x1="880" y1="460" x2="1010" y2="561" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="975" y="505" font-size="11" fill="#526575">top-4 + source links</text>

  <path d="M 1080 690 C 1080 745 260 745 200 694" fill="none" stroke="#3E8814" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrowg)"/>
  <text x="640" y="758" font-size="12.5" font-weight="600" fill="#3E8814" text-anchor="middle">markdown answer &#183; &#8220;as of 6:55 PM EST&#8221; &#183; source links</text>

  <!-- row 4: maybe later -->
  <rect x="40" y="785" width="1160" height="125" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-dasharray="8 5"/>
  <text x="60" y="813" font-size="12" font-weight="600" letter-spacing="1.5" fill="#868E96">4 &#8212; MAYBE / LATER</text>

  <rect x="70" y="827" width="250" height="66" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="195" y="851" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">answer cache</text>
  <text x="195" y="871" font-size="11" fill="#868E96" text-anchor="middle">reuse repeat answers, skip Claude</text>

  <rect x="365" y="827" width="250" height="66" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="490" y="851" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">auto-resync</text>
  <text x="490" y="871" font-size="11" fill="#868E96" text-anchor="middle">refresh Chroma after every poll</text>

  <rect x="660" y="827" width="250" height="66" rx="33" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785" y="851" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">someone's AI agent</text>
  <text x="785" y="871" font-size="11" fill="#868E96" text-anchor="middle">Claude Code, Cursor, a script</text>

  <rect x="955" y="827" width="250" height="66" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1080" y="851" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">MCP server</text>
  <text x="1080" y="871" font-size="11" fill="#868E96" text-anchor="middle">reads local data &#8212; MISO sees no traffic</text>

  <line x1="910" y1="860" x2="951" y2="860" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>

  <text x="620" y="948" font-size="13" fill="#526575" text-anchor="middle">No live MISO calls at question time &#8212; answers come from the local copy and always say how fresh they are.</text>
</svg>
