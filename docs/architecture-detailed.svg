<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087CC1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E8814"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ADB5BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>
  <text x="620" y="36" font-size="18" font-weight="700" fill="#092A47" text-anchor="middle">MISO Copilot &#8212; detailed architecture</text>

  <!-- band 1: background feed -->
  <rect x="40" y="60" width="820" height="230" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="90" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">EVERY 5 MINUTES &#8212; BACKGROUND FEED</text>

  <rect x="70" y="120" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="175" y="148" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">MISO Public APIs</text>
  <text x="175" y="172" font-size="11.5" fill="#526575" text-anchor="middle">FuelMix &#183; RealTimeTotalLoad</text>
  <text x="175" y="190" font-size="11.5" fill="#526575" text-anchor="middle">Snapshot &#183; WindSolar</text>
  <text x="175" y="212" font-size="11.5" fill="#526575" text-anchor="middle">free JSON, no auth</text>

  <rect x="330" y="120" width="240" height="130" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="450" y="148" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">Poller (APScheduler)</text>
  <text x="450" y="172" font-size="11.5" fill="#526575" text-anchor="middle">rate guard: 1 req/link/min lease</text>
  <text x="450" y="190" font-size="11.5" fill="#526575" text-anchor="middle">shape gate rejects bad payloads</text>
  <text x="450" y="208" font-size="11.5" fill="#526575" text-anchor="middle">atomic writes &#8212; never a torn file</text>
  <text x="450" y="226" font-size="11.5" fill="#526575" text-anchor="middle">fails closed, never bursts</text>

  <rect x="620" y="120" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="725" y="148" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">data/raw/</text>
  <text x="725" y="172" font-size="11.5" fill="#526575" text-anchor="middle">verbatim JSON, one per feed</text>
  <text x="725" y="190" font-size="11.5" fill="#526575" text-anchor="middle">_status.json: health + frozen-</text>
  <text x="725" y="206" font-size="11.5" fill="#526575" text-anchor="middle">feed detection (RefId)</text>
  <text x="725" y="228" font-size="11.5" fill="#526575" text-anchor="middle">raw.backup/ = demo fallback</text>

  <line x1="280" y1="185" x2="326" y2="185" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="185" x2="616" y2="185" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- band 2: ingestion -->
  <rect x="40" y="310" width="820" height="180" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="340" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">GETTING KNOWLEDGE INTO THE STORE</text>

  <rect x="580" y="355" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="715" y="381" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">RAG sync: JSON &#8594; prose &#8594; UPSERT</text>
  <text x="715" y="404" font-size="11.5" fill="#526575" text-anchor="middle">prose embeds well; raw JSON doesn't</text>
  <text x="715" y="422" font-size="11.5" fill="#526575" text-anchor="middle">fixed doc_id &#8212; replace, never append</text>
  <text x="715" y="440" font-size="11.5" fill="#526575" text-anchor="middle">no chunking: already one paragraph</text>

  <line x1="725" y1="250" x2="720" y2="351" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="405" x2="916" y2="395" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="360" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="175" y="388" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">data/docs/ &#8212; empty today</text>
  <text x="175" y="410" font-size="11" fill="#868E96" text-anchor="middle">Fact Sheet, report pages,</text>
  <text x="175" y="426" font-size="11" fill="#868E96" text-anchor="middle">help articles (planned)</text>

  <rect x="330" y="360" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="430" y="392" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">chunk + embed</text>
  <text x="430" y="414" font-size="11" fill="#868E96" text-anchor="middle">SentenceSplitter 512/50</text>

  <line x1="280" y1="405" x2="326" y2="405" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>
  <path d="M 530 420 C 700 480 850 465 917 425" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>

  <!-- Chroma cylinder -->
  <path d="M 920 270 L 920 450 A 100 22 0 0 0 1120 450 L 1120 270" fill="#EDF6FB" stroke="#087CC1" stroke-width="1.5"/>
  <ellipse cx="1020" cy="270" rx="100" ry="22" fill="#EDF6FB" stroke="#087CC1" stroke-width="1.5"/>
  <text x="1020" y="336" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">Chroma</text>
  <text x="1020" y="358" font-size="11.5" fill="#526575" text-anchor="middle">the ONLY store &#183; local disk</text>
  <text x="1020" y="376" font-size="11.5" fill="#526575" text-anchor="middle">live snapshots (4 docs, fresh)</text>
  <text x="1020" y="394" font-size="11.5" fill="#526575" text-anchor="middle">+ doc chunks (later)</text>
  <text x="1020" y="416" font-size="11.5" fill="#526575" text-anchor="middle">embeddings: MiniLM, on-device</text>

  <!-- band 3: question time -->
  <rect x="40" y="540" width="820" height="300" rx="12" fill="#F6F9FB" stroke="#DCE5EB"/>
  <text x="60" y="570" font-size="12" font-weight="600" letter-spacing="1.5" fill="#526575">WHEN YOU ASK</text>

  <rect x="70" y="600" width="110" height="60" rx="30" fill="#092A47"/>
  <text x="125" y="635" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">User</text>

  <rect x="220" y="590" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="320" y="615" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">Chat widget</text>
  <text x="320" y="637" font-size="11.5" fill="#526575" text-anchor="middle">React &#183; markdown, KaTeX, charts</text>
  <text x="320" y="655" font-size="11.5" fill="#526575" text-anchor="middle">Streamlit backup UI</text>

  <rect x="470" y="590" width="160" height="84" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="550" y="615" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">FastAPI /ask</text>
  <text x="550" y="637" font-size="11.5" fill="#526575" text-anchor="middle">input capped 2000 chars</text>
  <text x="550" y="655" font-size="11.5" fill="#526575" text-anchor="middle">clean HTTP errors</text>

  <rect x="670" y="590" width="180" height="84" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="760" y="615" font-size="15" font-weight="600" fill="#122B40" text-anchor="middle">Claude</text>
  <text x="760" y="637" font-size="11.5" fill="#526575" text-anchor="middle">Opus 5 + MISO system prompt</text>
  <text x="760" y="655" font-size="11.5" fill="#526575" text-anchor="middle">FORCE_MOCK switch for free tests</text>

  <line x1="180" y1="632" x2="216" y2="632" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="632" x2="466" y2="632" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="632" x2="666" y2="632" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="550" y1="590" x2="935" y2="468" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="516" font-size="11.5" fill="#526575" text-anchor="middle">search_docs: top-4 by meaning</text>
  <line x1="990" y1="470" x2="790" y2="586" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="945" y="545" font-size="11.5" fill="#526575" text-anchor="middle">snapshots + sources</text>

  <path d="M 760 674 C 760 760 220 760 128 664" fill="none" stroke="#3E8814" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrowg)"/>
  <text x="440" y="784" font-size="12.5" font-weight="600" fill="#3E8814" text-anchor="middle">markdown answer &#183; &#8220;as of 6:55 PM EST&#8221; &#183; source links</text>
  <text x="440" y="816" font-size="11.5" fill="#526575" text-anchor="middle">can't answer? graceful handoff to MISO's contact form &#8212; never a dead end</text>

  <!-- maybe / later column -->
  <text x="1050" y="566" font-size="12" font-weight="600" letter-spacing="1.5" fill="#868E96" text-anchor="middle">MAYBE / LATER</text>

  <rect x="900" y="580" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1050" y="602" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">answer cache</text>
  <text x="1050" y="620" font-size="11" fill="#868E96" text-anchor="middle">skip Claude for repeated questions</text>

  <rect x="900" y="650" width="300" height="66" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1050" y="674" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">MCP server</text>
  <text x="1050" y="692" font-size="11" fill="#868E96" text-anchor="middle">other AI assistants automate on our</text>
  <text x="1050" y="707" font-size="11" fill="#868E96" text-anchor="middle">local data &#8212; MISO sees zero traffic</text>

  <rect x="900" y="734" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1050" y="756" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">auto-resync after each poll</text>
  <text x="1050" y="774" font-size="11" fill="#868E96" text-anchor="middle">today Chroma syncs at server boot</text>

  <path d="M 1105 465 C 1175 500 1185 560 1160 646" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrowm)"/>

  <text x="620" y="876" font-size="13" fill="#526575" text-anchor="middle">No live MISO calls at question time &#8212; answers come from the local copy and always say how fresh they are.</text>
  <text x="620" y="898" font-size="12" fill="#868E96" text-anchor="middle">Poller lane: 627 tests, 100% branch coverage &#183; the rate guard makes MISO's 1-request-per-minute rule mechanical.</text>
</svg>
