" y="469" text-anchor="middle" font-size="12" font-weight="600" fill="#65B82E">every 5 min: ask</text><path d="M1268,372 L1158,632" fill="none" stroke="#65B82E" stroke-width="2.6" marker-end="url(#ag)"/><rect x="1152.2" y="547" width="71.6" height="20" rx="5" fill="#ffffff" stroke="#DCE5EB" stroke-width="1"/><text x="1188" y="561" text-anchor="middle" font-size="12" font-weight="600" fill="#65B82E">JSON back</text><path d="M1058,650 L678,678" fill="none" stroke="#65B82E" stroke-width="2.6" marker-end="url(#ag)"/><rect x="867.2" y="635" width="135.60000000000002" height="20" rx="5" fill="#ffffff" stroke="#DCE5EB" stroke-width="1"/><text x="935" y="649" text-anchor="middle" font-size="12" font-weight="600" fill="#65B82E">parsed text → embed</text><path d="M632,784 L790,800" fill="none" stroke="#65B82E" stroke-width="2.6" marker-end="url(#ag)"/><rect x="622.6" y="803" width="154.8" height="20" rx="5" fill="#ffffff" stroke="#DCE5EB" stroke-width="1"/><text x="700" y="817" text-anchor="middle" font-size="12" font-weight="600" fill="#65B82E">embed → store (UPSERT)</text></svg>