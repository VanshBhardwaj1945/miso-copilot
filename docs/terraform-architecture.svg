necap="round" stroke-linejoin="round"/><path d="M724,386 v-22 M724,386 l-6,-7 M724,386 l6,-7" stroke="#1496D4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="377" font-size="14" font-weight="700" fill="#092A47">Load balancer</text><rect x="80" y="470" width="1222" height="410" rx="22" fill="#F6F9FB" stroke="#1496D4" stroke-width="2"/><text x="104" y="858" font-size="18" font-weight="800" fill="#087CC1">Cluster  ·  2–5 nodes  ·  everything inside is a pod</text><g filter="url(#sh)"><rect x="560" y="505" width="270" height="96" rx="16" fill="#ffffff" stroke="#DCE5EB" stroke-width="1.5"/></g><text x="695.0" y="533" text-anchor="middle" font-size="17" font-weight="800" fill="#092A47">API</text><text x="695.0" y="555" text-anchor="middle" font-size="12.5" fill="#526575">orchestrates the answer</text><g filter="url(#sh)"><circle cx="628" cy="720" r="66" fill="#ffffff" stroke="#092A47" stroke-width="2.5"/></g><text x="628" y="714" text-anchor="middle" font-size="16" font-weight="800" fill="#092A47">MiniLM</text><text x="628" y="734" text-anchor="middle" font-size="11.5" fill="#526575">embeds text → vector</text><g filter="url(#sh)"><path d="M785.0,711.0 a95.0,16 0 0 1 190,0 v118 a95.0,16 0 0 1 -190,0 Z" fill="#ffffff" stroke="#087CC1" stroke-width="2"/><path d="M785.0,711.0 a95.0,16 0 0 0 190,0" fill="none" stroke="#087CC1" stroke-width="2"/></g><text x="880" y="749.0" text-anchor="middle" font-size="16" font-weight="800" fill="#092A47">Chroma</text><text x="880" y="768.0" text-anchor="middle" font-size="11.5" fill="#526575">holds data as vectors</text><text x="880" y="785.0" text-anchor="middle" font-size="11.5" fill="#526575">finds closest matches</text><g filter="url(#sh)"><circle cx="1120" cy="690" r="72" fill="#ffffff" stroke="#092A47" stroke-width="2.5"/></g><text x="1120" y="684" text-anchor="middle" font-size="16" font-weight="800" fill="#092A47">Poller</text><text x="1120" y="704" text-anchor="middle" font-size="11.