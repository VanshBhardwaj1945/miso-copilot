<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087CC1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868E96"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
  <text x="620" y="36" font-size="18" font-weight="700" fill="#092A47" text-anchor="middle">MISO Copilot on Azure &#8212; reference deployment (infra/main.tf)</text>

  <!-- user -->
  <rect x="40" y="96" width="120" height="52" rx="26" fill="#092A47"/>
  <text x="100" y="127" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">User</text>

  <!-- Azure resource group boundary -->
  <rect x="220" y="70" width="760" height="520" rx="14" fill="#F6F9FB" stroke="#087CC1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="240" y="100" font-size="12" font-weight="600" letter-spacing="1.5" fill="#087CC1">AZURE &#8212; RESOURCE GROUP misocopilot-rg</text>

  <!-- Static Web App -->
  <rect x="260" y="130" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="360" y="158" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Static Web App</text>
  <text x="360" y="178" font-size="11.5" fill="#526575" text-anchor="middle">React frontend build</text>
  <text x="360" y="194" font-size="11.5" fill="#526575" text-anchor="middle">free tier</text>

  <!-- Key Vault -->
  <rect x="740" y="110" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="845" y="138" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Key Vault</text>
  <text x="845" y="158" font-size="11.5" fill="#526575" text-anchor="middle">claude-api-key secret</text>
  <text x="845" y="174" font-size="11.5" fill="#526575" text-anchor="middle">read via managed identity</text>

  <!-- Container Apps Environment -->
  <rect x="260" y="260" width="440" height="200" rx="12" fill="#EDF6FB" stroke="#087CC1" stroke-width="1"/>
  <text x="280" y="286" font-size="11" font-weight="600" letter-spacing="1" fill="#526575">CONTAINER APPS ENVIRONMENT</text>

  <rect x="290" y="300" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="430" y="328" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Container App: FastAPI + poller</text>
  <text x="430" y="352" font-size="11.5" fill="#526575" text-anchor="middle">image built by CI, pulled from GHCR</text>
  <text x="430" y="370" font-size="11.5" fill="#526575" text-anchor="middle">exactly 1 replica &#8212; the rate guard</text>
  <text x="430" y="386" font-size="11.5" fill="#526575" text-anchor="middle">and scheduler must never run twice</text>
  <text x="430" y="408" font-size="11.5" fill="#526575" text-anchor="middle">2 GB RAM (embedding model)</text>

  <!-- Azure Files -->
  <rect x="740" y="300" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="845" y="328" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Azure Files share</text>
  <text x="845" y="350" font-size="11.5" fill="#526575" text-anchor="middle">data/: Chroma, raw snapshots,</text>
  <text x="845" y="366" font-size="11.5" fill="#526575" text-anchor="middle">request log</text>
  <text x="845" y="388" font-size="11.5" fill="#526575" text-anchor="middle">5 GB &#8212; this stack is tiny</text>

  <!-- Log Analytics -->
  <rect x="740" y="460" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="845" y="488" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Log Analytics</text>
  <text x="845" y="508" font-size="11.5" fill="#526575" text-anchor="middle">app + poller logs</text>
  <text x="845" y="524" font-size="11.5" fill="#526575" text-anchor="middle">30-day retention</text>

  <!-- external services -->
  <rect x="1010" y="130" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5"/>
  <text x="1105" y="158" font-size="14" font-weight="600" fill="#495057" text-anchor="middle">MISO Public APIs</text>
  <text x="1105" y="178" font-size="11" fill="#868E96" text-anchor="middle">public-api.misoenergy.org</text>
  <text x="1105" y="194" font-size="11" fill="#868E96" text-anchor="middle">(outside Azure)</text>

  <rect x="1010" y="430" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5"/>
  <text x="1105" y="458" font-size="14" font-weight="600" fill="#495057" text-anchor="middle">Anthropic API</text>
  <text x="1105" y="478" font-size="11" fill="#868E96" text-anchor="middle">Claude answers</text>

  <!-- arrows -->
  <line x1="160" y1="122" x2="256" y2="152" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="210" x2="415" y2="296" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="248" font-size="11" fill="#526575">/ask</text>

  <line x1="560" y1="300" x2="736" y2="172" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="234" font-size="11" fill="#526575">reads secret</text>

  <line x1="570" y1="368" x2="736" y2="355" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="655" y="348" font-size="11" fill="#526575">mounted /app/data</text>

  <line x1="660" y1="440" x2="736" y2="490" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="472" font-size="11" fill="#526575">logs</text>

  <line x1="500" y1="300" x2="1006" y2="200" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrowm)"/>
  <text x="770" y="252" font-size="11" fill="#868E96">poller: max 1 request per link per minute</text>

  <line x1="560" y1="416" x2="1006" y2="460" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrowm)"/>
  <text x="800" y="428" font-size="11" fill="#868E96">one Claude call per question</text>

  <text x="620" y="630" font-size="13" fill="#526575" text-anchor="middle">Reference architecture only &#8212; nothing here has been deployed. `terraform validate` passes (azurerm ~&gt; 5.4).</text>
  <text x="620" y="654" font-size="12" fill="#868E96" text-anchor="middle">Same shape as the local setup: one backend process, one data folder &#8212; just with Azure names on the boxes.</text>
</svg>
