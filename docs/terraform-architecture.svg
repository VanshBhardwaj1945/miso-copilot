<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087CC1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868E96"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>
  <text x="620" y="36" font-size="18" font-weight="700" fill="#092A47" text-anchor="middle">MISO Copilot in production &#8212; reference deployment (infra/main.tf)</text>

  <!-- row 0: user -->
  <rect x="560" y="60" width="120" height="48" rx="24" fill="#092A47"/>
  <text x="620" y="89" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">User</text>

  <!-- row 1: frontend + WAF edge -->
  <rect x="250" y="150" width="280" height="88" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="390" y="176" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Static Web App</text>
  <text x="266" y="199" font-size="11.5" fill="#526575">&#8226;  serves the React build</text>
  <text x="266" y="217" font-size="11.5" fill="#526575">&#8226;  free tier, global CDN</text>

  <rect x="710" y="150" width="280" height="88" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="850" y="176" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">App Gateway + WAF</text>
  <text x="726" y="199" font-size="11.5" fill="#526575">&#8226;  load balancer + firewall (OWASP)</text>
  <text x="726" y="217" font-size="11.5" fill="#526575">&#8226;  blocks &gt;60 req/min per IP at the edge</text>

  <line x1="590" y1="108" x2="420" y2="146" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="122" font-size="11" fill="#526575">loads the UI</text>
  <line x1="650" y1="108" x2="820" y2="146" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="122" font-size="11" fill="#526575">/ask</text>

  <!-- row 2: AKS cluster -->
  <rect x="140" y="290" width="960" height="220" rx="14" fill="#F6F9FB" stroke="#087CC1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="160" y="320" font-size="12" font-weight="600" letter-spacing="1.5" fill="#087CC1">AKS CLUSTER &#8212; 2&#8211;5 NODES, AUTOSCALING</text>

  <line x1="870" y1="238" x2="960" y2="341" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="170" y="345" width="210" height="135" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="275" y="371" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">poller</text>
  <text x="186" y="396" font-size="11.5" fill="#526575">&#8226;  exactly 1 replica</text>
  <text x="186" y="414" font-size="11.5" fill="#526575">&#8226;  rate guard: the ONLY</text>
  <text x="186" y="432" font-size="11.5" fill="#526575">    thing that calls MISO</text>
  <text x="186" y="450" font-size="11.5" fill="#526575">&#8226;  writes snapshots</text>

  <rect x="410" y="345" width="210" height="135" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="515" y="371" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">chroma</text>
  <text x="426" y="396" font-size="11.5" fill="#526575">&#8226;  client/server mode</text>
  <text x="426" y="414" font-size="11.5" fill="#526575">&#8226;  1 replica, persistent volume</text>
  <text x="426" y="432" font-size="11.5" fill="#526575">&#8226;  api + mcp query it</text>
  <text x="426" y="450" font-size="11.5" fill="#526575">    over HTTP</text>

  <rect x="650" y="345" width="210" height="135" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="755" y="371" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">mcp</text>
  <text x="666" y="396" font-size="11.5" fill="#526575">&#8226;  MCP server</text>
  <text x="666" y="414" font-size="11.5" fill="#526575">&#8226;  other AI assistants</text>
  <text x="666" y="432" font-size="11.5" fill="#526575">    automate here</text>
  <text x="666" y="450" font-size="11.5" fill="#526575">&#8226;  reads chroma only</text>

  <rect x="890" y="345" width="190" height="135" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="985" y="371" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">api</text>
  <text x="906" y="396" font-size="11.5" fill="#526575">&#8226;  FastAPI /ask</text>
  <text x="906" y="414" font-size="11.5" fill="#526575">&#8226;  N replicas, HPA</text>
  <text x="906" y="432" font-size="11.5" fill="#526575">&#8226;  scales freely: the poller</text>
  <text x="906" y="450" font-size="11.5" fill="#526575">    no longer lives inside it</text>

  <!-- row 3: shared services -->
  <rect x="140" y="580" width="290" height="106" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="285" y="606" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Redis</text>
  <text x="156" y="631" font-size="11.5" fill="#526575">&#8226;  answer cache (fresh until next poll)</text>
  <text x="156" y="649" font-size="11.5" fill="#526575">&#8226;  shared per-IP rate-limit counters</text>
  <text x="156" y="667" font-size="11.5" fill="#526575">&#8226;  works across N api replicas</text>

  <rect x="475" y="580" width="290" height="106" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="620" y="606" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Azure Files</text>
  <text x="491" y="631" font-size="11.5" fill="#526575">&#8226;  raw MISO snapshots + status</text>
  <text x="491" y="649" font-size="11.5" fill="#526575">&#8226;  request log (ip, question, outcome)</text>
  <text x="491" y="667" font-size="11.5" fill="#526575">&#8226;  Chroma's persistent volume</text>

  <rect x="810" y="580" width="290" height="106" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="955" y="606" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Key Vault + ACR</text>
  <text x="826" y="631" font-size="11.5" fill="#526575">&#8226;  claude-api-key, read via</text>
  <text x="826" y="649" font-size="11.5" fill="#526575">    workload identity</text>
  <text x="826" y="667" font-size="11.5" fill="#526575">&#8226;  ACR holds the container images</text>

  <line x1="285" y1="510" x2="285" y2="576" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="510" x2="620" y2="576" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="955" y1="510" x2="955" y2="576" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 4: observability -->
  <rect x="310" y="750" width="290" height="88" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="455" y="776" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">Log Analytics</text>
  <text x="326" y="799" font-size="11.5" fill="#526575">&#8226;  app, poller + WAF logs</text>
  <text x="326" y="817" font-size="11.5" fill="#526575">&#8226;  30-day retention</text>

  <rect x="680" y="750" width="290" height="88" rx="10" fill="#FFFFFF" stroke="#087CC1" stroke-width="1.5"/>
  <text x="825" y="776" font-size="14" font-weight="600" fill="#122B40" text-anchor="middle">SIEM</text>
  <text x="696" y="799" font-size="11.5" fill="#526575">&#8226;  workspace onboarded &#8212; every</text>
  <text x="696" y="817" font-size="11.5" fill="#526575">    request + WAF event, forwarded</text>

  <line x1="455" y1="690" x2="455" y2="746" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="722" font-size="11" fill="#526575">logs</text>
  <line x1="600" y1="794" x2="676" y2="794" stroke="#087CC1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="638" y="784" font-size="11" fill="#526575">forwarded</text>

  <!-- external services, bottom-left / bottom-right of cluster -->
  <rect x="40" y="150" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5"/>
  <text x="115" y="180" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">MISO APIs</text>
  <text x="115" y="202" font-size="11" fill="#868E96" text-anchor="middle">public, free JSON</text>
  <text x="115" y="218" font-size="11" fill="#868E96" text-anchor="middle">(outside Azure)</text>

  <line x1="240" y1="345" x2="130" y2="242" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrowm)"/>
  <text x="60" y="270" font-size="11" fill="#868E96">max 1 req/link/min</text>

  <rect x="1050" y="150" width="150" height="88" rx="10" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5"/>
  <text x="1125" y="180" font-size="13" font-weight="600" fill="#495057" text-anchor="middle">Anthropic API</text>
  <text x="1125" y="202" font-size="11" fill="#868E96" text-anchor="middle">Claude writes</text>
  <text x="1125" y="218" font-size="11" fill="#868E96" text-anchor="middle">the answers</text>

  <line x1="1030" y1="345" x2="1115" y2="242" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrowm)"/>
  <text x="1090" y="270" font-size="11" fill="#868E96">one call/question</text>

  <text x="620" y="920" font-size="13" fill="#526575" text-anchor="middle">Reference architecture only &#8212; nothing here has been deployed. `terraform validate` passes (azurerm ~&gt; 5.4).</text>
  <text x="620" y="944" font-size="12" fill="#868E96" text-anchor="middle">Same rules as the laptop version: one poller, staleness disclosed, MISO never sees more than one request per link per minute.</text>
</svg>
