[pytest]
# Running `pytest` with no arguments should do the right thing, so that
# "did I break it" is one word rather than a command someone has to remember.
testpaths = tests
# Puts the repo root on sys.path, so `backend.poller` and `tests.stub`
# import the same way under a bare `pytest` as under `python -m pytest`.
pythonpath = .
addopts =
    -q
    --strict-markers
    --cov=backend
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=90

# --cov-fail-under is the part that matters, and the scope above is what makes
# the number mean something. It measured backend.poller alone until 2026-09-10,
# so a run could report "100 percent" while backend/rag, routes, llm and
# security had no tests at all - a true number answering a question nobody was
# asking. It now covers the whole package.
#
# Not every module is equally covered: main.py (app wiring) and ingest_docs.py
# (filesystem plus Chroma) are thin on tests, and the floor accommodates that
# deliberately rather than by accident.

markers =
    slow: takes more than a second, usually because it forks processes
